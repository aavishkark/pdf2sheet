services:
  # ── Full Stack Application (Node/Express serving React) ─────────────────────
  - type: web
    name: pdf2sheet
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (sensitive values):
      # - key: MONGODB_URI
      #   value: <your-mongodb-atlas-uri>
      # - key: JWT_SECRET
      #   value: <your-jwt-secret>
      # - key: FRONTEND_URL
      #   value: https://pdf2sheet.onrender.com   ← update after deploy
      # - key: GOOGLE_SERVICE_ACCOUNT_KEY
      #   value: <base64-encoded JSON or raw JSON>
