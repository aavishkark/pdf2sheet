services:
  # ── Backend (Node/Express API) ──────────────────────────────────────────────
  - type: web
    name: pdf2sheet-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (sensitive values):
      # - key: MONGODB_URI
      #   value: <your-mongodb-atlas-uri>
      # - key: JWT_SECRET
      #   value: <your-jwt-secret>
      # - key: FRONTEND_URL
      #   value: https://pdf2sheet-frontend.onrender.com   ← update after deploy
      # - key: GOOGLE_SERVICE_ACCOUNT_KEY
      #   value: <base64-encoded JSON or raw JSON>

  # ── Frontend (Vite/React SPA as Static Site) ────────────────────────────────
  - type: web
    name: pdf2sheet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this in the Render dashboard:
      # - key: VITE_API_URL
      #   value: https://pdf2sheet-backend.onrender.com/api
